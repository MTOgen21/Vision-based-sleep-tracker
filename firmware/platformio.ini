[env]
platform = espressif32@6.10.0
framework = arduino
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=0

[env:camera]
board = esp32cam
build_src_filter = +<camera.cpp>
upload_speed = 115200
monitor_speed = 115200

[env:bridge]
board = esp32dev
build_src_filter = +<bridge.cpp>
monitor_speed = 921600
